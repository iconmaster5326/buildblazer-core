$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/iconmaster5326/buildblazer/schema/systems/generic/trait.yaml
title: (Generic) Trait
description: A generic note or ability.
allOf:
  - $ref: https://github.com/iconmaster5326/buildblazer/schema/entity.yaml
  - type: object
    required:
      - description
    properties:
      type:
        const: trait
      description:
        description: The human-readable notes for this trait.
        type: string
