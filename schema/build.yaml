$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/iconmaster5326/buildblazer/schema/build.yaml
title: Build
description: A Buildblazer "build" - a plan to alter an entity by a set of discrete milestones.
type: object
required:
  - id
  - name
  - system
  - systemVersion
  - milestones
  - sheets
properties:
  id:
    description: The UUID of the resulting entity.
    type: string
    format: uuid
  name:
    description: The human-readable name of the resulting entity.
    type: string
  system:
    description: The system this build was made for.
    type: string
  systemVersion:
    description: The version of the system this build was last made in.
    type: integer
  milestones:
    description: The milestones in this build. In many systems, this is by level, but it can be by other things as well.
    type: array
    items:
      title: Milestone
      description: A discrete point at which a build gains features.
      type: object
      required:
        - name
        - changes
      properties:
        changes:
          description: What this build alters at this milestone.
          type: array
          items:
            title: Change
            description: Either the initial state of an entity, or something a build can alter at a certain milestone.
            type: object
            required:
              - type
              - subject
              - property
            properties:
              type:
                description: The type of change.
              subject:
                description: The UUID of the entity to alter.
                type: string
                format: uuid
              property:
                description: The name of the property to alter.
                type: string
            oneOf:
              - title: Change (Set)
                description: Set a property in an entity to a raw value.
                required:
                  - value
                properties:
                  type:
                    const: set
                  value:
                    description: The raw value or entity to directly set the property to.
              - title: Change (Add)
                description: Insert an entity into an entity list.
                required:
                  - entity
                properties:
                  type:
                    const: add
                  entity:
                    description: The entity to insert into the list.
                    type: object
                  index:
                    description: If not the end of the list, where to insert?
                    oneOf:
                      - type: "null"
                      - type: integer
              - title: Change (Move)
                description: Move an entity around in an entity list.
                required:
                  - entity
                  - index
                properties:
                  type:
                    const: move
                  entity:
                    description: The UUID of the entity to move.
                    type: string
                  index:
                    description: The new index of the entity.
                    type: integer
              - title: Change (Delete)
                description: Delete an entity from an entity list.
                required:
                  - entity
                properties:
                  type:
                    const: del
                  entity:
                    description: The UUID of the entity to delete.
                    type: string
  sheets:
    description: The sheets for this character.
    type: array
    items:
      title: Sheet
      description: A build at a given milestone and state.
      type: object
      required:
        - milestone
        - counters
        - toggles
      properties:
        name:
          description: The name of this particular sheet, if build/milestone isn't enough.
          oneOf:
            - type: "null"
            - type: string
        milestone:
          description: The milestone this sheet is at.
          type: string
        counters:
          description: A map of counter UUID to counter value.
          type: object
          additionalProperties:
            description: The value of the counter.
            type: number
        toggles:
          description: A map of toggle UUID to toggle value.
          type: object
          additionalProperties:
            description: The value of the toggle.
            type: boolean
