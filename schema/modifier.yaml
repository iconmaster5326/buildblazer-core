$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/iconmaster5326/buildblazer/schema/modifier.yaml
title: Modifier
description: A Buildblazer modifier - Something that alters a statistic's value.
allOf:
  - $ref: https://github.com/iconmaster5326/buildblazer/schema/entity.yaml
  - type: object
    required:
      - stat
      - op
      - value
    properties:
      type:
        const: mod
      stat:
        description: The UUID of the statistic this modifier targets.
        type: string
        format: uuid
      op:
        description: The type of this modifier.
        enum:
          - set
          - add
          - sub
          - mul
          - div
      value:
        description: The expression to alter the value by.
        type: string
      condition:
        description: The expression that controls if this modifier applies.
        oneOf:
          - type: "null"
          - type: string
